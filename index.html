<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vreme – Slovenija</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --border:#e6e7ee; --text:#111; --muted:#666;
      --shadow: 0 8px 24px rgba(0,0,0,.06); --radius:16px; --accent:#0b57d0;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; padding:18px; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap{ max-width:1100px; margin:0 auto; }
    .topbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .nav a{
      display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid var(--border);
      background:#fff; color:var(--text); text-decoration:none; font-weight:700; font-size:13px;
    }
    .nav a.active{ border-color:#c9d6ff; color:var(--accent); }
    .card{
      background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);
      padding:16px;
    }
    h2{ margin:0 0 8px; }
    .muted{ color:var(--muted); font-size:13px; }
    .grid{ margin-top:12px; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    @media (max-width: 820px){ .grid{ grid-template-columns: 1fr; } }
    .city{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .big{ font-size:30px; font-weight:900; }
    .label{ font-size:12px; color:var(--muted); }
    .row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .pill{ display:inline-block; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:12px; }
    table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
    th,td{ text-align:left; padding:10px 8px; border-top:1px solid var(--border); }
    th{ color:var(--muted); font-weight:800; }
    .err{ color:#b00020; font-size:13px; margin-top:10px; }
    .ok{ font-size:12px; color:var(--muted); margin-top:10px; }
    select{
      padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:#fff; font-size:14px;
    }
    button{
      padding:10px 12px; border-radius:12px; border:1px solid #111; background:#111; color:#fff; cursor:pointer; font-weight:800;
    }
    button.secondary{ background:#fff; color:#111; border:1px solid var(--border); }
  </style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="nav">
      <a href="./index.html">Oglasi</a>
      <a class="active" href="./weather.html">Vreme</a>
    </div>
    <div class="muted" id="stamp">—</div>
  </div>

  <div class="card">
    <h2>Vreme – Slovenija</h2>
    <div class="muted">
      Vir: Open-Meteo (brez API ključa). Prikaz: trenutna temperatura + veter + padavine + 3-dnevna napoved.
    </div>

    <div class="row" style="margin-top:12px;">
      <div>
        <div class="label">Izberi lokacijo</div>
        <select id="loc">
          <option value="lj">Ljubljana</option>
          <option value="mb">Maribor</option>
          <option value="ce">Celje</option>
          <option value="kp">Koper</option>
          <option value="kr">Kranj</option>
          <option value="nm">Novo mesto</option>
          <option value="ms">Murska Sobota</option>
          <option value="ng">Nova Gorica</option>
        </select>
      </div>
      <div style="align-self:end;">
        <button onclick="loadWeather()">Osveži</button>
        <button class="secondary" onclick="autoToggle()" id="autoBtn">Auto: OFF</button>
      </div>
    </div>

    <div class="grid">
      <div class="card" style="box-shadow:none;">
        <div class="city">
          <div>
            <div class="label" id="cityName">—</div>
            <div class="big" id="temp">—</div>
          </div>
          <div class="muted" style="text-align:right;">
            <div id="wx">—</div>
            <div class="label" id="time">—</div>
          </div>
        </div>

        <div class="row">
          <span class="pill" id="wind">Veter: —</span>
          <span class="pill" id="rain">Padavine: —</span>
          <span class="pill" id="hum">Vlaga: —</span>
        </div>

        <div class="ok" id="srcNote"></div>
        <div class="err" id="err"></div>
      </div>

      <div class="card" style="box-shadow:none;">
        <div style="font-weight:900;">3-dnevna napoved</div>
        <table>
          <thead>
            <tr><th>Datum</th><th>Min</th><th>Max</th><th>Padavine</th></tr>
          </thead>
          <tbody id="forecast"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // Koordinate (Slovenija)
  const LOCS = {
    lj: { name:"Ljubljana", lat:46.0569, lon:14.5058 },
    mb: { name:"Maribor", lat:46.5547, lon:15.6467 },
    ce: { name:"Celje", lat:46.2389, lon:15.2675 },
    kp: { name:"Koper", lat:45.5481, lon:13.7302 },
    kr: { name:"Kranj", lat:46.2389, lon:14.3556 },
    nm: { name:"Novo mesto", lat:45.8011, lon:15.1714 },
    ms: { name:"Murska Sobota", lat:46.6613, lon:16.1660 },
    ng: { name:"Nova Gorica", lat:45.9560, lon:13.6484 },
  };

  // WMO weather codes (osnovni prevod)
  const WMO = {
    0:"Jasno", 1:"Pretežno jasno", 2:"Delno oblačno", 3:"Oblačno",
    45:"Megla", 48:"Rime megla",
    51:"Rahla rosenje", 53:"Zmerno rosenje", 55:"Močno rosenje",
    61:"Rahla dež", 63:"Zmeren dež", 65:"Močan dež",
    71:"Rahla sneg", 73:"Zmeren sneg", 75:"Močan sneg",
    80:"Kratkotrajne plohe", 81:"Plohe", 82:"Močne plohe",
    95:"Nevihta", 96:"Nevihta s točo", 99:"Močna nevihta s točo"
  };

  let autoTimer = null;

  function $(id){ return document.getElementById(id); }

  function setErr(msg){ $("err").textContent = msg || ""; }

  function fmtTemp(t){
    if (t === null || t === undefined || Number.isNaN(t)) return "—";
    return Math.round(t) + "°C";
  }

  function toISODate(d){ return new Date(d).toISOString().slice(0,10); }

  async function loadWeather(){
    setErr("");
    const key = $("loc").value;
    const loc = LOCS[key] || LOCS.lj;

    $("cityName").textContent = loc.name;
    $("temp").textContent = "…";
    $("wx").textContent = "…";
    $("time").textContent = "…";
    $("wind").textContent = "Veter: …";
    $("rain").textContent = "Padavine: …";
    $("hum").textContent = "Vlaga: …";
    $("forecast").innerHTML = "";

    try{
      const url =
        "https://api.open-meteo.com/v1/forecast"
        + `?latitude=${encodeURIComponent(loc.lat)}&longitude=${encodeURIComponent(loc.lon)}`
        + "&timezone=Europe%2FLjubljana"
        + "&current=temperature_2m,relative_humidity_2m,precipitation,wind_speed_10m,weather_code"
        + "&daily=temperature_2m_min,temperature_2m_max,precipitation_sum"
        + "&forecast_days=3";

      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      const cur = data.current || {};
      const temp = cur.temperature_2m;
      const hum = cur.relative_humidity_2m;
      const wind = cur.wind_speed_10m;
      const rain = cur.precipitation;
      const code = cur.weather_code;

      $("temp").textContent = fmtTemp(temp);
      $("wx").textContent = WMO[code] || ("Koda: " + code);
      $("time").textContent = cur.time ? ("Posodobljeno: " + cur.time.replace("T"," ")) : "";

      $("wind").textContent = "Veter: " + (wind != null ? (Math.round(wind) + " km/h") : "—");
      $("rain").textContent = "Padavine: " + (rain != null ? (rain + " mm") : "—");
      $("hum").textContent = "Vlaga: " + (hum != null ? (hum + " %") : "—");

      // 3-dnevna napoved
      const d = data.daily || {};
      const days = d.time || [];
      const mins = d.temperature_2m_min || [];
      const maxs = d.temperature_2m_max || [];
      const psum = d.precipitation_sum || [];

      const tbody = $("forecast");
      for (let i = 0; i < days.length; i++){
        const tr = document.createElement("tr");
        tr.innerHTML =
          `<td>${days[i]}</td>` +
          `<td>${fmtTemp(mins[i])}</td>` +
          `<td>${fmtTemp(maxs[i])}</td>` +
          `<td>${(psum[i] != null ? (psum[i] + " mm") : "—")}</td>`;
        tbody.appendChild(tr);
      }

      $("stamp").textContent = "Zadnja osvežitev: " + new Date().toLocaleString();
      $("srcNote").textContent = "Podatki: api.open-meteo.com";

    } catch(e){
      setErr("Napaka pri nalaganju vremena: " + (e?.message || e));
      $("temp").textContent = "—";
      $("wx").textContent = "—";
    }
  }

  function autoToggle(){
    const btn = $("autoBtn");
    if (autoTimer){
      clearInterval(autoTimer);
      autoTimer = null;
      btn.textContent = "Auto: OFF";
      return;
    }
    autoTimer = setInterval(loadWeather, 5 * 60 * 1000); // 5 min
    btn.textContent = "Auto: ON";
    loadWeather();
  }

  // init
  (function init(){
    $("loc").value = "lj";
    loadWeather();
  })();
</script>
</body>
</html>
