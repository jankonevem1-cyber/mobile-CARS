<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avto.net – Iskalnik & Oglasi</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --border:#e6e7ee;
      --text:#111;
      --muted:#666;
      --accent:#0b57d0;
      --new:#0a7;
      --danger:#b00020;
      --shadow: 0 8px 24px rgba(0,0,0,.06);
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:18px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:var(--bg); color:var(--text);
    }

    .wrap{ max-width:1100px; margin:0 auto; }

    /* ====== ISKALNIK ====== */
    .searchCard{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:16px;
    }
    .searchTitle{
      font-weight:800;
      font-size:18px;
      margin:0 0 8px;
    }
    .hint{ color:var(--muted); font-size:13px; margin-bottom:12px; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 120px 120px;
      gap:10px;
      align-items:end;
    }
    @media (max-width: 820px){
      .grid{ grid-template-columns: 1fr; }
    }
    label{ font-size:12px; color:var(--muted); display:block; margin:0 0 6px; }
    input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      font-size:14px;
      outline:none;
    }
    input:focus{ border-color:#c9d6ff; box-shadow:0 0 0 3px rgba(11,87,208,.10); }
    .btnRow{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top:12px;
    }
    button{
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #111;
      background:#111;
      color:#fff;
      cursor:pointer;
      font-weight:700;
    }
    button.secondary{
      background:#fff;
      color:#111;
      border:1px solid var(--border);
    }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .statusRow{
      margin-top:10px;
      font-size:13px;
      color:#333;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .error{ color:var(--danger); }

    /* ====== OGLASI ====== */
    .adsHeader{
      margin-top:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .adsTitle{
      font-size:16px;
      font-weight:800;
      margin:0;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid var(--border);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
    }
    .list{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .adCard{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:14px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .adLeft{ min-width:0; }
    .adTitle{
      font-weight:800;
      line-height:1.2;
      margin:0 0 6px;
      font-size:15px;
    }
    .adTitle a{
      color:var(--accent);
      text-decoration:none;
    }
    .adTitle a:hover{ text-decoration:underline; }
    .meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#fff;
      font-size:12px;
      color:#333;
    }
    .pill.new{
      border-color: rgba(10,167,120,.35);
      color: var(--new);
      font-weight:900;
    }
    .adRight{
      flex-shrink:0;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      min-width:120px;
    }
    .price{
      font-weight:900;
      font-size:16px;
    }
    .small{ font-size:12px; color:var(--muted); }

    .empty{
      background:#fff;
      border:1px dashed var(--border);
      border-radius:var(--radius);
      padding:14px;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ISKALNIK -->
  <div class="searchCard">
    <div class="searchTitle">Iskalnik</div>
    <div class="hint">
      Prilepi Avto.net URL rezultatov (tvoj link). Stran osvežuje in prikazuje najnovejše oglase do določene cene.
      <b>Priporočilo:</b> interval 60s ali več (da ne blokira).
    </div>

    <div class="grid">
      <div>
        <label>Avto.net link (rezultati)</label>
        <input id="url" type="text" />
      </div>

      <div>
        <label>Max €</label>
        <input id="maxPrice" type="number" value="2000" min="0" step="50" />
      </div>

      <div>
        <label>Interval (s)</label>
        <input id="intervalSec" type="number" value="60" min="30" step="10" />
      </div>
    </div>

    <div class="btnRow">
      <button id="btnStart" onclick="start()">Start</button>
      <button id="btnStop" class="secondary" onclick="stop()" disabled>Stop</button>
      <button class="secondary" onclick="refreshOnce()">Ročno osveži</button>
      <button class="secondary" onclick="resetSeen()">Reset “seen”</button>
    </div>

    <div class="statusRow">
      <div id="status">Pripravljen.</div>
      <div id="error" class="error"></div>
    </div>
  </div>

  <!-- OGLASI -->
  <div class="adsHeader">
    <h3 class="adsTitle">Oglasi</h3>
    <div class="badge" id="lastCheck">Zadnji check: —</div>
  </div>

  <div id="list" class="list"></div>

</div>

<script>
  const DEFAULT_URL = "https://www.avto.net/Ads/results_100.asp?oglasrubrika=1&prodajalec=2";

  const PROXIES = [
    (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    (url) => "https://r.jina.ai/http://" + url.replace(/^https?:\\/\\//i, "")
  ];

  const LS_SEEN_KEY = "avtonet_seen_ids_v2";
  const LS_CFG_KEY  = "avtonet_cfg_v2";

  let timer = null;
  let inFlight = false;

  function $(id){ return document.getElementById(id); }

  function setStatus(msg){ $("status").textContent = msg || ""; }
  function setError(msg){ $("error").textContent = msg || ""; }

  function nowStr(){
    return new Date().toLocaleString();
  }

  function loadCfg(){
    try { return JSON.parse(localStorage.getItem(LS_CFG_KEY) || "{}"); } catch { return {}; }
  }
  function saveCfg(cfg){
    localStorage.setItem(LS_CFG_KEY, JSON.stringify(cfg));
  }

  function loadSeen(){
    try { return JSON.parse(localStorage.getItem(LS_SEEN_KEY) || "[]"); } catch { return []; }
  }
  function saveSeen(arr){
    localStorage.setItem(LS_SEEN_KEY, JSON.stringify(arr));
  }

  function resetSeen(){
    saveSeen([]);
    setStatus("Resetirano: “seen” je prazno.");
    setError("");
    renderCards([], new Set());
  }

  function normalizeUrl(u){
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\\/\\//i.test(u)) u = "https://" + u;
    return u;
  }

  async function fetchHtml(url){
    let lastErr = null;
    for (const p of PROXIES){
      try{
        const proxied = p(url);
        const res = await fetch(proxied, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      } catch(e){
        lastErr = e;
      }
    }
    throw lastErr || new Error("Fetch failed");
  }

  function absUrl(base, href){
    try { return new URL(href, base).toString(); }
    catch { return href; }
  }

  function extractPriceEUR(text){
    if (!text) return null;
    const t = text.replace(/\\u00a0/g, " ");
    const m = t.match(/(\\d[\\d\\.\\s]{0,10})\\s*€|€\\s*(\\d[\\d\\.\\s]{0,10})/);
    if (!m) return null;
    const raw = (m[1] || m[2] || "").replace(/[.\\s]/g, "");
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? n : null;
  }

  // Bolj robustno: Avto.net linki do oglasov niso vedno Ads/details.asp
  function parseResults(html, baseUrl){
    const doc = new DOMParser().parseFromString(html, "text/html");
    const anchors = Array.from(doc.querySelectorAll("a[href]"));
    const out = [];

    const reAdLink = /(ads\\/details\\.asp|\\/ad\\.asp|ads\\/ad\\.asp|\\/oglas\\.asp|\\/ad\\/)/i;

    function findContainer(el){
      let cur = el;
      for (let i = 0; i < 10; i++){
        if (!cur) break;
        const txt = (cur.textContent || "").replace(/\\s+/g, " ").trim();
        if (txt.includes("€")) return cur;
        cur = cur.parentElement;
      }
      return el.parentElement || el;
    }

    for (const a of anchors){
      const hrefRaw = a.getAttribute("href") || "";
      const href = absUrl(baseUrl, hrefRaw);
      if (!reAdLink.test(href)) continue;

      const title = (a.textContent || "").replace(/\\s+/g, " ").trim() || "Oglas";
      const container = findContainer(a);
      const containerText = (container?.textContent || "").replace(/\\s+/g, " ").trim();
      const price = extractPriceEUR(containerText);

      let id = href;
      const idMatch = href.match(/(id|ID)=([0-9]+)/);
      if (idMatch) id = idMatch[2];

      out.push({ id, title, href, price });
    }

    const seen = new Set();
    const uniq = [];
    for (const x of out){
      const key = String(x.id || x.href);
      if (seen.has(key)) continue;
      seen.add(key);
      uniq.push(x);
    }
    return uniq;
  }

  function renderCards(items, seenSet){
    const list = $("list");
    list.innerHTML = "";

    const maxPrice = parseInt($("maxPrice").value, 10) || 2000;

    const filtered = items.filter(x => x.price != null && x.price <= maxPrice);
    const withFlags = filtered.map(x => ({...x, isNew: !seenSet.has(String(x.id || x.href))}));
    const news = withFlags.filter(x => x.isNew);
    const olds = withFlags.filter(x => !x.isNew);
    const finalList = [...news, ...olds];

    if (!finalList.length){
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = `Ni zadetkov do ${maxPrice} € (ali Avto.net/proxy ne vrne oglasov).`;
      list.appendChild(div);
      return { newCount: 0, shown: 0 };
    }

    for (const x of finalList.slice(0, 80)){
      const card = document.createElement("div");
      card.className = "adCard";

      const left = document.createElement("div");
      left.className = "adLeft";

      const title = document.createElement("div");
      title.className = "adTitle";
      const a = document.createElement("a");
      a.href = x.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = x.title;
      title.appendChild(a);

      const meta = document.createElement("div");
      meta.className = "meta";

      const pPrice = document.createElement("span");
      pPrice.className = "pill";
      pPrice.textContent = (x.price != null ? `${x.price} €` : "cena ?");
      meta.appendChild(pPrice);

      if (x.isNew){
        const pNew = document.createElement("span");
        pNew.className = "pill new";
        pNew.textContent = "NEW";
        meta.appendChild(pNew);
      }

      left.appendChild(title);
      left.appendChild(meta);

      const right = document.createElement("div");
      right.className = "adRight";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = (x.price != null ? `${x.price} €` : "");

      const small = document.createElement("div");
      small.className = "small";
      small.textContent = x.isNew ? "novo najdeno" : "že videno";

      right.appendChild(price);
      right.appendChild(small);

      card.appendChild(left);
      card.appendChild(right);

      list.appendChild(card);
    }

    return { newCount: news.length, shown: finalList.length };
  }

  async function refreshOnce(){
    if (inFlight) return;
    inFlight = true;

    try{
      setError("");
      const url = normalizeUrl($("url").value);
      const maxPrice = parseInt($("maxPrice").value, 10) || 2000;

      if (!url){ setError("Manjka URL."); return; }

      setStatus("Nalagam Avto.net…");
      const html = await fetchHtml(url);
      const items = parseResults(html, url);

      const seenArr = loadSeen();
      const seenSet = new Set(seenArr.map(String));

      const { newCount, shown } = renderCards(items, seenSet);

      // označi prikazane kot seen
      const toMark = items
        .filter(x => x.price != null && x.price <= maxPrice)
        .map(x => String(x.id || x.href));

      const merged = Array.from(new Set([...seenArr.map(String), ...toMark]));
      saveSeen(merged);

      $("lastCheck").textContent = "Zadnji check: " + nowStr();
      setStatus(`OK. Prikazujem ${shown} oglasov do ${maxPrice} €. Novi: ${newCount}.`);

      if (newCount > 0) {
        try { new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=").play(); } catch {}
      }

    } catch(e){
      setStatus("");
      setError("Napaka pri nalaganju. Avto.net/proxy lahko blokira. (" + (e?.message || e) + ")");
    } finally {
      inFlight = false;
    }
  }

  function start(){
    const intervalSec = Math.max(30, parseInt($("intervalSec").value, 10) || 60);

    saveCfg({
      url: $("url").value,
      maxPrice: $("maxPrice").value,
      intervalSec: intervalSec
    });

    $("btnStart").disabled = true;
    $("btnStop").disabled = false;

    stop();               // počisti star timer
    refreshOnce();        // takoj
    timer = setInterval(refreshOnce, intervalSec * 1000);

    setStatus("Auto-refresh ON (" + intervalSec + "s).");
  }

  function stop(){
    if (timer) clearInterval(timer);
    timer = null;
    $("btnStart").disabled = false;
    $("btnStop").disabled = true;
  }

  // init
  (function init(){
    const cfg = loadCfg();
    $("url").value = normalizeUrl(cfg.url || DEFAULT_URL);
    $("maxPrice").value = cfg.maxPrice || 2000;
    $("intervalSec").value = Math.max(30, cfg.intervalSec || 60);
    renderCards([], new Set());
  })();
</script>
</body>
</html>
